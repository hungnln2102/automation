# Ghép với docker-compose.yml — chạy: ./deploy.sh
# API + scheduler — secrets / CORS: apps/backend/.env.docker (npm run bootstrap).
#
# DATABASE_URL: chỉ lấy từ apps/backend/.env.docker (không ghi đè ở đây) để có thể trỏ Postgres
# trong Docker (@postgres:5432) hoặc server ngoài (host/IP thật). Mẫu DB ngoài: env.docker.external-db.example
# REDIS_URL: vẫn set trong environment bên dưới (redis nội bộ compose).
#
# prerequisites: cp apps/backend/env.docker.example (hoặc env.docker.external-db.example) → .env.docker
#
# depends_on postgres `required: false`: khi chỉ dùng Postgres ngoài, có thể `up -d redis backend scheduler`
# mà không cần service postgres cục bộ (Compose v2.20+).

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: automation-stack-backend
    restart: unless-stopped
    shm_size: "2gb"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    env_file:
      - ./apps/backend/.env.docker
    environment:
      NODE_ENV: production
      APP_ENV: docker
      PORT: "6000"
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
    ports:
      - "${BACKEND_HOST_PORT:-6000}:6000"
    volumes:
      - automation_adobe_profiles:/app/.adobe-profiles

  scheduler:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: automation-stack-scheduler
    restart: unless-stopped
    shm_size: "2gb"
    command: ["node", "scheduler.js"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./apps/backend/.env.docker
    environment:
      NODE_ENV: production
      APP_ENV: docker
      PORT: "6000"
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
    volumes:
      - automation_adobe_profiles:/app/.adobe-profiles

volumes:
  automation_adobe_profiles:
    name: automation_stack_adobe_profiles
