# Dedicated stack for the standalone Automation workspace.
# PostgreSQL: map cổng localhost 5432 → 5432 trong container.
# Backend trong Docker dùng host `postgres`; Beekeeper/psql trên host hoặc qua SSH tunnel dùng 127.0.0.1:5432.
# Redis host :6480.

services:
  postgres:
    image: postgres:16-alpine
    container_name: automation-stack-postgres
    environment:
      POSTGRES_USER: admin_store_admin
      POSTGRES_PASSWORD: admin_store_dev
      POSTGRES_DB: admin_store
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - admin_store_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_store_admin -d admin_store"]
      interval: 6s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: automation-stack-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6480:6379"
    volumes:
      - automation_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8

volumes:
  admin_store_pg_data:
    name: admin_store_pg_data
  automation_redis_data:
    name: automation_stack_redis_data
