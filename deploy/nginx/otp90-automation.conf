# -------- API (subdomain riêng) --------
server {
    listen 443 ssl http2;
    server_name api.otp90.com;

    # This cert currently covers otp90.com, admin.otp90.com, and www.otp90.com.
    # Add api.otp90.com to the cert before using this HTTPS API host directly.
    ssl_certificate     /etc/letsencrypt/live/otp90.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otp90.com/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location / {
        proxy_pass http://automation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

