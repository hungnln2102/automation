# Nginx — cùng bản build SPA Automation, hai hostname:
#   admin.otp90.com  → bàn điều khiển (đăng nhập)
#   otp90.com + www → form Renew Adobe công khai (routing theo hostname phía SPA)
#
# Backend upstream (Docker hoặc node :6000) — chỉnh nếu khác cổng.
# SSL: chỉnh đường dẫn cert hoặc dùng certbot.

upstream automation_backend {
    server 127.0.0.1:6000;
    keepalive 64;
}

# -------- Form công khai (apex + www) --------
server {
    listen 443 ssl http2;
    server_name otp90.com www.otp90.com;

    ssl_certificate     /etc/letsencrypt/live/otp90.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otp90.com/privkey.pem;

    root /var/www/automation-admin/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://automation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# -------- Dashboard admin --------
server {
    listen 443 ssl http2;
    server_name admin.otp90.com;

    ssl_certificate     /etc/letsencrypt/live/admin.otp90.com/fullchain.pem;
