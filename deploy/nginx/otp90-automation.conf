# Nginx — cùng bản build SPA Automation:
#   admin.otp90.com  → bàn điều khiển (đăng nhập)
#   otp90.com + www → form Renew Adobe công khai (routing theo hostname phía SPA)
#   api.otp90.com    → proxy API phụ (Express :6000). Frontend production build mặc định gọi /api cùng origin.
#
# Backend upstream (Docker hoặc node :6000) — chỉnh nếu khác cổng.
# SSL: chỉnh đường dẫn cert hoặc dùng certbot.

upstream automation_backend {
    server 127.0.0.1:6000;
    keepalive 64;
}

# -------- HTTP API (no redirect) --------
server {
    listen 80;
    listen [::]:80;
    server_name api.otp90.com;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location / {
        proxy_pass http://automation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# -------- HTTP public form (no redirect) --------
server {
    listen 80;
    listen [::]:80;
    server_name otp90.com www.otp90.com;

    root /var/www/automation-admin/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://automation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

