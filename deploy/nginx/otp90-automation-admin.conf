# Ví CHỈ admin.otp90.com — không có apex otp90.com. Bản khuyến nghị: `otp90-automation.conf`.
# ─────────────────────────────────────────────────────────────────────────────
# Ví dụ Nginx — dashboard Automation (SPA + proxy API).
# Sao chép sang /etc/nginx/sites-available/, chỉnh ssl_certificate và root dist.
#
# Build frontend: cd Automation/apps/frontend && npm run build
# Dist mặc định: apps/frontend/dist — deploy ví dụ: /var/www/automation-admin/dist
#
# Let's Encrypt ví dụ:
#   certbot certonly --webroot -w /var/www/certbot -d admin.otp90.com

# Bỏ comment nếu muốn chỉ HTTPS.
# server {
#     listen 80;
#     server_name admin.otp90.com;
#     location /.well-known/acme-challenge/ { root /var/www/certbot; }
#     location / { return 301 https://$host$request_uri; }
# }

server {
    listen 443 ssl http2;
    server_name admin.otp90.com;

    ssl_certificate     /etc/letsencrypt/live/admin.otp90.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.otp90.com/privkey.pem;

    root /var/www/automation-admin/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
