# Nginx HTTP-only — đặt trước khi có SSL (otp90 đã vào được http://otp90.com).
# Sau đó chạy certbot thì chuyển sang otp90-automation.conf (HTTPS) hoặc certbot chỉnh tự động.
#
# Bước:
#   1) sudo mkdir -p /var/www/automation-admin
#   2) Deploy dist: trong repo chạy `npm run build --prefix apps/frontend`, copy nội dung dist → /var/www/automation-admin/
#   3) sudo ln -sf /PATH/automation/deploy/nginx/otp90-automation.http.conf \
#           /etc/nginx/sites-available/automation-otp90.http
#      (hoặc copy nội dung vào đó)
#   4) sudo ln -sf /etc/nginx/sites-available/automation-otp90.http \
#           /etc/nginx/sites-enabled/99-automation-otp90.http
#   5) sudo rm -f /etc/nginx/sites-enabled/default   # để không còn trang nginx mặc định
#   6) sudo nginx -t && sudo systemctl reload nginx
#
# Backend (Docker/script): cổng 6000 trong container/host — chỉnh upstream nếu khác.

upstream automation_backend {
    server 127.0.0.1:6000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name otp90.com www.otp90.com;

    root /var/www/automation-admin;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://automation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.otp90.com;

    root /var/www/automation-admin;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://automation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
